<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- This icon appears in the browser tab. You can replace the Vite logo with your own cafe logo later -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Ensures your website scales correctly on mobile phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- The title that appears in the browser tab and search engines -->
    <title>Our Yesterdays Escape Café</title>

    <!-- A description of your site for Google search results -->
    <meta name="description" content="Welcome to Our Yesterdays Escape. A unique café and story experience." />
  </head>
  <body>
    <!-- 
      THIS IS THE MOST IMPORTANT LINE. 
      This empty div is the "anchor". React will grab this div by its ID ("root") 
      and inject all of your cafe components, videos, and buttons right here. 
    -->
    <div id="root"></div>
    
    <!-- 
      This script tells the HTML file where to find your React code. 
      It loads your main Javascript file, which in turn loads your SharedHub component.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>

  <html lang="en" className="scroll-smooth"></html>
  
</html>
